<h1>Решение алгоритмической задачи</h1>

<form id="taskForm"
      action="https://www.bing.com/search"
      method="get"
      target="_blank">

  <p>
    <b>Условие:</b>
    даны вещественные числа X, Y, Z.
    Определить, существует ли треугольник с такими длинами сторон
    и, если существует, будет ли он прямоугольным.
  </p>

  <input type="hidden"
         name="q"
         value="Решение алгоритмической задачи 1009">

  <p>
    <label for="x">X:</label>
    <input type="text" id="x" name="X" value="3">
  </p>

  <p>
    <label for="y">Y:</label>
    <input type="text" id="y" name="Y" value="4">
  </p>

  <p>
    <label for="z">Z:</label>
    <input type="text" id="z" name="Z" value="5">
  </p>

  <p>
    <label for="result">Результат решения задачи:</label>
    <input type="text"
           id="result"
           name="result"
           value="не определен"
           readonly>
  </p>

  <p>
    Действие 1:
    <button type="button" onclick="solve()">Проверить</button>
  </p>

  <p>
    Действие 2:
    <button type="button" onclick="sendData()">Отправить</button>
  </p>

</form>

<script>
  var triangleExists = false;

  function readNumber(id) {
    var text = document.getElementById(id).value.trim().replace(",", ".");

    if (text === "") {
      return NaN;
    }

    return Number(text);
  }

  function solve() {
    var x = readNumber("x");
    var y = readNumber("y");
    var z = readNumber("z");
    var result = document.getElementById("result");

    triangleExists = false;

    if (!isFinite(x) || !isFinite(y) || !isFinite(z)) {
      result.value = "Ошибка: введите три числа";
      return;
    }

    var sides = [x, y, z].sort(function (a, b) {
      return a - b;
    });

    var a = sides[0];
    var b = sides[1];
    var c = sides[2];

    if (a <= 0 || a + b <= c) {
      result.value = "Треугольник не существует";
      return;
    }

    triangleExists = true;

    var eps = 1e-9 * Math.max(1, c * c);

    if (Math.abs(a * a + b * b - c * c) <= eps) {
      result.value = "Треугольник прямоугольный";
    } else {
      result.value = "Треугольник не прямоугольный";
    }
  }

  function sendData() {
    solve();

    if (!triangleExists) {
      alert("Нельзя отправить данные: треугольник не существует или введены неправильные данные.");
      return;
    }

    document.getElementById("taskForm").submit();
  }
</script>
